name: 42c-Bank CI - Audit, Scan & Firewall

# Trigger on push or pull requests to the workshop branch
on:
  push:
    branches:
      - workshop
  pull_request:
    branches:
      - workshop

env:
  platformUrl: 'https://demolabs.42crunch.cloud'
  platformService: 'services.demolabs.42crunch.cloud:8001'
  X42C_API_TOKEN: ${{ secrets.API_KEY }}
  API_URL: 'https://cute-noble-boar.ngrok-free.app/apis/banking/v1'

jobs:

  # ──────────────────────────────────────────────
  # Job 1 - 42Crunch API Security Audit
  # ──────────────────────────────────────────────
  audit:
    name: 42Crunch Audit
    runs-on: ubuntu-latest
    outputs:
      api_uuid: ${{ steps.Check_Audit.outputs.API_UUID }}
      api_alias_id: ${{ steps.Fetch_API_AliasId.outputs.API_ALIAS_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List files
        run: ls -la ${{ github.workspace }}

      # # ── Option A: Docker image (current) ──
      # - name: Set up Docker
      #   uses: docker/setup-buildx-action@v2

      # - name: Run 42Crunch Audit Docker Image
      #   run: |
      #     docker run -v "${{ github.workspace }}:/workspace" \
      #       --user 0:0 \
      #       -e X42C_REPOSITORY_URL=https://github.com/42c-arhayem/42c-banking \
      #       -e X42C_PLATFORM_URL=${{ env.platformUrl }} \
      #       -e X42C_API_TOKEN=${{ env.X42C_API_TOKEN }} \
      #       -e X42C_BRANCH_NAME=workshop \
      #       -e X42C_LOG_LEVEL=DEBUG \
      #       -e X42C_JSON_REPORT=audit-action-report-${{ github.run_id }}.json \
      #       42crunch/docker-api-security-audit:v4

      # ── Option B: Native GitHub Action plugin (uncomment to use instead) ──
      - name: Run 42Crunch Audit (Native Plugin)
        uses: 42Crunch/api-security-audit-action@v4
        with:
          api-token: ${{ env.X42C_API_TOKEN }}
          platform-url: ${{ env.platformUrl }}
          log-level: DEBUG
          json-report: audit-action-report-${{ github.run_id }}.json
        # Note: The native plugin handles discovery, upload, and audit natively.
        # It also supports SARIF upload to GitHub Security tab.
        # When switching to this, you can remove the 'Set up Docker' step.

      - name: Check Audit Summary Report
        id: Check_Audit
        run: |
          echo "Audit JSON Report:"
          echo ${{ github.workspace }}/audit-action-report-${{ github.run_id }}.json
          cat ${{ github.workspace }}/audit-action-report-${{ github.run_id }}.json
          apiId=$(cat ${{ github.workspace }}/audit-action-report-${{ github.run_id }}.json | jq -r '.audit.report."backend/openapi/openAPI_remediated.json".apiId')
          echo "Bank API UUID: $apiId"
          echo "API_UUID=$apiId" >> $GITHUB_OUTPUT

      - name: Fetch API AliasId
        id: Fetch_API_AliasId
        run: |
          cat ${{ github.workspace }}/.42c/conf.yaml
          aliasId=$(yq '.apis.["backend/openapi/openAPI_remediated.json"].alias' < ${{ github.workspace }}/.42c/conf.yaml)
          echo "Bank API AliasId: $aliasId"
          echo "API_ALIAS_ID=$aliasId" >> $GITHUB_OUTPUT

      - name: Save API UUID for Drift Scan
        run: |
          echo "${{ steps.Check_Audit.outputs.API_UUID }}" > api-uuid.txt
          echo "Saved API UUID: $(cat api-uuid.txt)"

      - name: Upload API UUID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-uuid
          path: api-uuid.txt
          retention-days: 7

